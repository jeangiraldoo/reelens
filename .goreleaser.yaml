version: 2

project_name: reelens

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X reelens/appinfo.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
